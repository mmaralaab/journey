<!doctype html> 
<html>
    <head>
        <title>javascript</title>
        <link rel="stylesheet" href="main.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
    </head>
    <body>
        <button onclick="change ()">menu</button>
        <button onclick="glow()">glow</button>

        <div class="menu">
        Hello World!
        </div>

        <div class="gear"></div>

        <script>
            var gear =  document.querySelector(".menu");
            var gear = document.querySelector(".gear")


            function change (){
                // var gear =  document.querySelector(".gear");

                console.log ('it works!');
                document.querySelector(".menu").classList.toggle("active");
                gear.classList.toggle("spin");
                document.body.classList.toggle("dark");
            }

            function glow() {
                console.log("we're glowing!");
                // document.querySelector(".gear").classList.toggle("glow");
                gear.classList.toggle("glow");
                menu.classList.toggle("glow");
            }

        </script>
    </body> 
</html>
